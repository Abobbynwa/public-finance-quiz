<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Admin</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><style>body{font-family:Arial;background:#f4f6f8;margin:0;padding:18px}.box{max-width:1220px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 5px 20px #0001}h1,h2{text-align:center}.nav,.grid,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cards{grid-template-columns:repeat(5,1fr)}.nav button{background:#e5e7eb;color:#111;font-weight:700}.nav button.on{background:#111827;color:#fff}.p{display:none;border:1px solid #ddd;background:#fafafa;padding:16px;border-radius:12px;margin-top:15px}.p.on{display:block}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#111827;color:#fff;border:0;cursor:pointer}.g{background:#166534}.r{background:#b91c1c}.v{background:#6d28d9}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;text-align:center}.card b{font-size:24px;display:block}.wrap{overflow-x:auto}table{width:100%;min-width:900px;border-collapse:collapse;font-size:13px}th,td{border:1px solid #ddd;padding:8px;vertical-align:top}th{background:#111827;color:#fff}.hide{display:none}.details{background:#fff;border:1px solid #ddd;border-left:5px solid #111827;border-radius:10px;padding:14px;margin:12px 0}.row{cursor:pointer}.row:hover{background:#eef2ff}@media(max-width:800px){.nav,.grid,.cards{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>Quiz Admin Dashboard</h1><div id="loginBox"><input id="pass" type="password" placeholder="Admin password"><button onclick="go()">Login</button></div><div id="main" class="hide"><div class="nav"><button id="bhome" onclick="show('home')">Dashboard</button><button id="bq" onclick="show('q')">Questions</button><button id="br" onclick="show('r')">Results</button><button id="bs" onclick="show('s')">Students</button><button id="bset" onclick="show('set')">Settings</button><button onclick="location.href='/upload.html'">Upload</button><button onclick="location.reload()">Logout</button></div><div id="home" class="p"><h2>Dashboard Summary</h2><button onclick="summary()">Refresh</button><div class="cards"><div class="card">Questions<b id="tq">0</b></div><div class="card">Active<b id="ta">0</b></div><div class="card">Inactive<b id="ti">0</b></div><div class="card">Students<b id="ts">0</b></div><div class="card">Results<b id="tr">0</b></div></div></div><div id="q" class="p"><h2>Questions</h2><div class="grid"><select id="qs" onchange="rq()"></select><select id="qst" onchange="rq()"><option value="">All Status</option><option>Active</option><option>Inactive</option></select><input id="qf" oninput="rq()" placeholder="Search"><button onclick="lq()">Refresh</button></div><button class="g" onclick="enableAll()">Enable All Questions</button><button class="g" onclick="enableShown()">Enable Shown Questions</button><button class="r" onclick="clearShownQ()">Clear Shown Questions</button><button class="v" onclick="exportQ()">Export Shown Questions</button><p id="qc"></p><div class="wrap"><table><thead><tr><th>No</th><th>Subject</th><th>Question</th><th>Answer</th><th>Status</th></tr></thead><tbody id="qt"></tbody></table></div></div><div id="r" class="p"><h2>Results</h2><div class="grid"><select id="rs" onchange="rr()"></select><input id="rd" oninput="rr()" placeholder="Department"><input id="rid" oninput="rr()" placeholder="Student ID"><button onclick="lr()">Refresh</button></div><button class="v" onclick="exportR()">Export Results</button><button class="r" onclick="clearShownR()">Clear Shown Results</button><button class="r" onclick="clearAllR()">Clear All Results</button><p id="rc"></p><div id="resultDetail" class="details hide"></div><div class="wrap"><table><thead><tr><th>Name</th><th>Dept</th><th>ID</th><th>Subject</th><th>Score</th><th>%</th><th>Date</th><th>Open</th></tr></thead><tbody id="rt"></tbody></table></div></div><div id="s" class="p"><h2>Students</h2><div class="grid"><input id="sf" oninput="rsd()" placeholder="Search name or ID"><select id="sd" onchange="rsd()"><option value="">All Departments</option><option>Science</option><option>Art</option><option>Commercial</option></select><select id="ssub" onchange="rsd()"></select><button onclick="ls()">Refresh</button></div><button class="v" onclick="exportS()">Export Filtered Students</button><p id="sc"></p><div id="studentDetail" class="details hide"></div><div class="wrap"><table><thead><tr><th>No</th><th>Name</th><th>ID</th><th>Department</th><th>Attempts</th><th>Best</th><th>Average</th><th>Date</th></tr></thead><tbody id="st"></tbody></table></div></div><div id="set" class="p"><h2>Exam Settings</h2><div class="grid"><input id="nq" type="number" placeholder="Questions per exam"><input id="tm" type="number" placeholder="Time minutes"><input id="pm" type="number" placeholder="Pass mark %"><select id="corr"><option value="yes">Show Correction Yes</option><option value="no">Show Correction No</option></select></div><select id="ret"><option value="yes">Allow Retake Yes</option><option value="no">Allow Retake No</option></select><button class="g" onclick="saveSet()">Save Settings</button><p id="sm"></p></div></div></div><script>const cfg={apiKey:"AIzaSyCgdl-oI3jrvTarOOzEqd791ZhE_CGBv6A",authDomain:"public-finance-quiz.firebaseapp.com",projectId:"public-finance-quiz",storageBucket:"public-finance-quiz.firebasestorage.app",messagingSenderId:"350473490107",appId:"1:350473490107:web:2f7275513a2d8cbad7e39e"};firebase.initializeApp(cfg);const db=firebase.firestore();const SUB=['Economics','Government','Commerce','Accounting','English Language','Mathematics','Biology','Chemistry','Physics','Agricultural Science','Civic Education','CRS'];let AQ=[],SQ=[],AR=[],SR=[],AS=[],SS=[],studentResults={};function e(x){return String(x||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function fill(){let o='<option value="">All Subjects</option>'+SUB.map(x=>'<option>'+x+'</option>').join('');qs.innerHTML=o;rs.innerHTML=o;ssub.innerHTML=o}function go(){let p=pass.value.trim();if(p!='valentine123'&&p!='ADIM@22')return alert('Wrong password');loginBox.classList.add('hide');main.classList.remove('hide');show('home')}function show(x){['home','q','r','s','set'].forEach(y=>{document.getElementById(y).classList.toggle('on',x==y);let b=document.getElementById('b'+y);if(b)b.classList.toggle('on',x==y)});if(x=='home')summary();if(x=='q')lq();if(x=='r')lr();if(x=='s')ls();if(x=='set')loadSet()}async function summary(){let q=await db.collection('quizQuestions').get(),r=await db.collection('quizResults').get(),s=await db.collection('students').get(),a=0;q.forEach(d=>{if(d.data().active)a++});tq.innerText=q.size;ta.innerText=a;ti.innerText=q.size-a;tr.innerText=r.size;ts.innerText=s.size}async function lq(){qc.innerText='Loading...';let snap=await db.collection('quizQuestions').get();AQ=snap.docs.map(d=>({id:d.id,...d.data()}));rq()}function rq(){let su=qs.value,sta=qst.value,se=qf.value.toLowerCase();SQ=AQ.filter(x=>(!su||(x.subject||'Economics')==su)&&(!sta||((x.active?'Active':'Inactive')==sta))&&(!se||String(x.q||'').toLowerCase().includes(se)));qc.innerText=SQ.length+' questions shown';qt.innerHTML=SQ.slice(0,500).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+e(x.subject)+'</td><td>'+e(x.q)+'</td><td>'+e(x.answer)+'</td><td>'+(x.active?'Active':'Inactive')+'</td></tr>').join('')}async function upd(list,patch){let b=db.batch(),c=0;for(let x of list){b.update(db.collection('quizQuestions').doc(x.id),patch);c++;if(c>=450){await b.commit();b=db.batch();c=0}}if(c>0)await b.commit()}async function enableAll(){if(!confirm('Enable every question?'))return;let list=AQ.length?AQ:(await db.collection('quizQuestions').get()).docs.map(d=>({id:d.id}));await upd(list,{active:true});alert('All questions enabled');lq()}async function enableShown(){if(!SQ.length)return alert('No shown question');await upd(SQ,{active:true});alert('Shown questions enabled');lq()}async function clearShownQ(){if(!SQ.length)return alert('No shown question');if(!confirm('Clear shown questions?'))return;await del('quizQuestions',SQ);alert('Questions cleared');lq()}function exportQ(){down(SQ.map(x=>({Subject:x.subject,Question:x.q,A:x.options?.[0],B:x.options?.[1],C:x.options?.[2],D:x.options?.[3],Answer:x.answer,Status:x.active?'Active':'Inactive'})),'questions.xlsx','Questions')}async function lr(){let snap=await db.collection('quizResults').get();AR=snap.docs.map(d=>({id:d.id,...d.data()}));rr()}function rr(){let su=rs.value,de=rd.value.toLowerCase(),id=rid.value.toLowerCase();SR=AR.filter(x=>(!su||(x.subject||'')==su)&&(!de||String(x.department||x.stream||x.className||'').toLowerCase().includes(de))&&(!id||String(x.studentId||'').toLowerCase().includes(id)));rc.innerText=SR.length+' results shown';rt.innerHTML=SR.map((x,i)=>{let pct=Math.round((x.score/x.total)*100),date=x.submittedAt&&x.submittedAt.toDate?x.submittedAt.toDate().toLocaleString():'Pending';x._date=date;x._pct=pct;return '<tr class="row"><td>'+e(x.name)+'</td><td>'+e(x.department||x.stream||x.className)+'</td><td>'+e(x.studentId)+'</td><td>'+e(x.subject)+'</td><td>'+x.score+'/'+x.total+'</td><td>'+pct+'%</td><td>'+date+'</td><td><button onclick="resultInfo('+i+')">View</button></td></tr>'}).join('')}function resultInfo(i){let x=SR[i],ans=x.answers||[],rows=ans.map(a=>'<tr><td>'+a.questionNumber+'</td><td>'+e(a.question)+'</td><td>'+e(a.selected)+'</td><td>'+e(a.correct)+'</td><td>'+(a.isCorrect?'Correct':'Wrong')+'</td></tr>').join('');resultDetail.classList.remove('hide');resultDetail.innerHTML='<h3>'+e(x.name)+' Result Details</h3><p><b>ID:</b> '+e(x.studentId)+' | <b>Subject:</b> '+e(x.subject)+' | <b>Score:</b> '+x.score+'/'+x.total+'</p><div class="wrap"><table><thead><tr><th>No</th><th>Question</th><th>Selected</th><th>Correct</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';resultDetail.scrollIntoView({behavior:'smooth'})}function exportR(){down(SR.map(x=>({'Student Name':x.name,Department:x.department||x.stream||x.className,'Student ID':x.studentId,Subject:x.subject,Score:x.score+'/'+x.total,Percentage:x._pct+'%',Date:x._date})),'results.xlsx','Results')}async function clearShownR(){if(!SR.length)return alert('No shown result');if(!confirm('Clear shown results?'))return;await del('quizResults',SR);alert('Shown results cleared');lr()}async function clearAllR(){if(!confirm('Clear ALL results?'))return;let snap=await db.collection('quizResults').get();await del('quizResults',snap.docs.map(d=>({id:d.id})));alert('All results cleared');lr()}async function del(col,list){let b=db.batch(),c=0;for(let x of list){b.delete(db.collection(col).doc(x.id));c++;if(c>=450){await b.commit();b=db.batch();c=0}}if(c>0)await b.commit()}async function ls(){let ss=await db.collection('students').get();AS=ss.docs.map(d=>({id:d.id,...d.data()}));let rr=await db.collection('quizResults').get();AR=rr.docs.map(d=>({id:d.id,...d.data()}));studentResults={};AR.forEach(r=>{let k=r.studentId||r.name;if(!studentResults[k])studentResults[k]=[];studentResults[k].push(r)});rsd()}function statsFor(x){let list=studentResults[x.studentId]||studentResults[x.name]||[],best=0,sum=0;list.forEach(r=>{let p=Math.round((r.score/r.total)*100);sum+=p;if(p>best)best=p});return{attempts:list.length,best:list.length?best:0,avg:list.length?Math.round(sum/list.length):0,results:list}}function rsd(){let f=sf.value.toLowerCase(),dep=sd.value,sub=ssub.value;SS=AS.filter(x=>{let dept=x.department||x.stream||x.className||'',text=String((x.name||'')+(x.studentId||'')+dept).toLowerCase(),res=studentResults[x.studentId]||studentResults[x.name]||[];return(!f||text.includes(f))&&(!dep||dept==dep)&&(!sub||res.some(r=>r.subject==sub))});sc.innerText=SS.length+' students shown';studentDetail.classList.add('hide');st.innerHTML=SS.map((x,i)=>{let s=statsFor(x),date=x.createdAt&&x.createdAt.toDate?x.createdAt.toDate().toLocaleString():'';return '<tr class="row" onclick="studentInfo('+i+')"><td>'+(i+1)+'</td><td>'+e(x.name)+'</td><td>'+e(x.studentId)+'</td><td>'+e(x.department||x.stream||x.className)+'</td><td>'+s.attempts+'</td><td>'+s.best+'%</td><td>'+s.avg+'%</td><td>'+date+'</td></tr>'}).join('')}function studentInfo(i){let x=SS[i],s=statsFor(x),rows=s.results.map(r=>{let p=Math.round((r.score/r.total)*100),date=r.submittedAt&&r.submittedAt.toDate?r.submittedAt.toDate().toLocaleString():'';return '<tr><td>'+e(r.subject)+'</td><td>'+r.score+'/'+r.total+'</td><td>'+p+'%</td><td>'+date+'</td></tr>'}).join('');studentDetail.classList.remove('hide');studentDetail.innerHTML='<h3>'+e(x.name)+' Details</h3><p><b>ID:</b> '+e(x.studentId)+' | <b>Department:</b> '+e(x.department||x.stream||x.className)+' | <b>Attempts:</b> '+s.attempts+' | <b>Best:</b> '+s.best+'% | <b>Average:</b> '+s.avg+'%</p><button class="v" onclick="exportOneStudent('+i+')">Export This Student</button><div class="wrap"><table><thead><tr><th>Subject</th><th>Score</th><th>%</th><th>Date</th></tr></thead><tbody>'+rows+'</tbody></table></div>';studentDetail.scrollIntoView({behavior:'smooth'})}function exportOneStudent(i){let x=SS[i],res=statsFor(x).results;down(res.map(r=>({Name:x.name,'Student ID':x.studentId,Department:x.department||x.stream||x.className,Subject:r.subject,Score:r.score+'/'+r.total,Percentage:Math.round((r.score/r.total)*100)+'%'})),(x.name||'student')+'_results.xlsx','Student')}function exportS(){down(SS.map(x=>{let s=statsFor(x);return{Name:x.name,'Student ID':x.studentId,Department:x.department||x.stream||x.className,Attempts:s.attempts,Best:s.best+'%',Average:s.avg+'%'}}),'students.xlsx','Students')}async function loadSet(){let d=await db.collection('settings').doc('exam').get(),s=d.exists?d.data():{};nq.value=s.questionsPerExam||20;tm.value=s.timeMinutes||15;pm.value=s.passMark||50;corr.value=s.showCorrection||'yes';ret.value=s.allowRetake||'yes'}async function saveSet(){await db.collection('settings').doc('exam').set({questionsPerExam:Number(nq.value||20),timeMinutes:Number(tm.value||15),passMark:Number(pm.value||50),showCorrection:corr.value,allowRetake:ret.value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});sm.innerText='Settings saved'}function down(rows,file,sheet){if(!rows.length)return alert('Nothing to export');let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,file)}fill();</script></body></html>
