<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduCBT Admin</title><style>body{font-family:Arial;background:#eef2f7;margin:0;color:#111827}.top{background:#0f172a;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;color:#cbd5e1}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;background:white;box-shadow:0 2px 12px #0001}.nav button{background:#0f172a;color:white;border:0;border-radius:10px;padding:14px;font-weight:800;cursor:pointer}.nav button.active{background:#166534}iframe{width:100%;height:calc(100vh - 142px);border:0;background:white}.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;margin:10px 14px}@media(max-width:800px){.top{display:block}.nav{grid-template-columns:1fr}iframe{height:75vh}}</style></head><body><div class="top"><div class="brand"><h1>EduCBT Admin Center</h1><p>Dashboard, question import, and student preview from one admin page.</p></div><b>Admin Workspace</b></div><div class="note"><b>Note:</b> Share only the student portal with students. This admin page is for school owner, admin, or IT only.</div><div class="nav"><button id="bDash" onclick="openTab('dash')">Dashboard</button><button id="bImport" onclick="openTab('import')">Question Import</button><button id="bStudent" onclick="openTab('student')">Student Preview</button></div><iframe id="frame" title="EduCBT Admin Frame"></iframe><script>function openTab(t){bDash.classList.remove('active');bImport.classList.remove('active');bStudent.classList.remove('active');if(t==='dash'){bDash.classList.add('active');frame.src='/dashboard3.html'}if(t==='import'){bImport.classList.add('active');frame.src='/upload.html'}if(t==='student'){bStudent.classList.add('active');frame.src='/student.html'}}openTab('dash')</script></body></html>
