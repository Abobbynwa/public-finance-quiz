<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduCBT</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><style>body{font-family:Arial;background:#eef2f7;padding:18px}.box{max-width:980px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 10px 30px #0002}.hero,.top{background:#0f172a;color:white;border-radius:16px;padding:20px;text-align:center}.top{display:flex;justify-content:space-between;text-align:left;position:sticky;top:0;z-index:9}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #cbd5e1;font-size:16px}button{background:#0f172a;color:white;border:0;font-weight:800}.green{background:#166534}.red{background:#991b1b}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.hide{display:none}.note{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px;margin:12px 0}.id{background:#ecfdf5;border:1px solid #86efac;text-align:center;padding:14px;border-radius:12px;color:#166534;font-weight:900}.q{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:14px 0}.opt label{display:block;background:white;border:1px solid #d1d5db;border-radius:10px;padding:12px;margin:8px 0}.slip{border:2px solid #0f172a;border-radius:16px;padding:18px}.slip table{width:100%;border-collapse:collapse}.slip td{border:1px solid #ddd;padding:9px}.score{text-align:center;font-size:38px;font-weight:900}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:800px){.grid,.actions{grid-template-columns:1fr}.top{display:block}}</style></head><body><div class="box" id="start"><div class="hero"><h1 id="schoolTitle">EduCBT Portal</h1><h3 id="mottoText">Knowledge and Excellence</h3><p><span id="termText">First Term</span> • <span id="sessionText">2025/2026</span> • <span id="examText">Quiz</span></p></div><div class="note"><b>Instruction:</b> Select class, arm and subject. After a result, use <b>Take Another Subject</b> to keep the same CBT number.</div><div class="grid"><input id="studentName" placeholder="Full name"><select id="cls" onchange="classChanged()"><option value="">Class</option><option>JSS1</option><option>JSS2</option><option>JSS3</option><option>SS1</option><option>SS2</option><option>SS3</option></select><select id="arm"><option value="">Arm</option><option>A</option><option>B</option><option>C</option><option>D</option></select><select id="stream" class="hide" onchange="streamChanged()"><option value="">Stream</option><option>Science</option><option>Art</option><option>Commercial</option></select><select id="sub" class="hide"><option value="">Subject</option></select></div><div class="id hide" id="idBox">CBT Number: <span id="cbt">---</span></div><button onclick="startExam()">Start Selected Subject</button></div><div class="box hide" id="exam"><div class="top"><div id="meta"></div><b id="timer">15:00</b></div><div id="qs"></div><button onclick="submitExam()">Submit Exam</button></div><div class="box hide" id="res"><div class="slip"><h1 id="rschool" style="text-align:center">EduCBT Portal</h1><h2 style="text-align:center">CBT Result Slip</h2><div id="rmeta"></div><div class="score" id="score"></div></div><div class="actions"><button onclick="window.print()">Print</button><button class="green" onclick="anotherSubject()">Take Another Subject</button><button class="red" onclick="location.reload()">New Student</button></div><div id="review"></div></div><script>const cfg={apiKey:'AIzaSyCgdl-oI3jrvTarOOzEqd791ZhE_CGBv6A',authDomain:'public-finance-quiz.firebaseapp.com',projectId:'public-finance-quiz',storageBucket:'public-finance-quiz.firebasestorage.app',messagingSenderId:'350473490107',appId:'1:350473490107:web:2f7275513a2d8cbad7e39e'};firebase.initializeApp(cfg);const db=firebase.firestore();const JSS=['English Language','Mathematics','Basic Science','Basic Technology','Social Studies','Civic Education','Business Studies','CRS','Agricultural Science','Computer Studies','Home Economics','PHE'];const SS={Science:['Mathematics','English Language','Biology','Chemistry','Physics','Agricultural Science','Civic Education'],Art:['English Language','Government','CRS','Civic Education','Economics'],Commercial:['English Language','Mathematics','Economics','Commerce','Accounting','Civic Education']};let SET={schoolName:'EduCBT Portal',motto:'Knowledge and Excellence',schoolCode:'EDU',term:'First Term',session:'2025/2026',examType:'Quiz',questionsPerExam:20,timeMinutes:15},sid='',cbtNo='',current=[],ans={},tick=null;function isSS(c){return ['SS1','SS2','SS3'].includes(c)}function isJSS(c){return ['JSS1','JSS2','JSS3'].includes(c)}function tidy(x){return String(x||'').replace(/\s*\(\d+\)\s*$/,'').replace(/^A JSS student is studying ([^.]+)\. What is the best answer\?$/i,'Choose the correct answer about $1.')}function nm(){return document.getElementById('studentName').value.trim()}async function loadSet(){let d=await db.collection('settings').doc('exam').get().catch(()=>null);if(d&&d.exists)SET={...SET,...d.data()};schoolTitle.innerText=SET.schoolName;mottoText.innerText=SET.motto;termText.innerText=SET.term;sessionText.innerText=SET.session;examText.innerText=SET.examType;rschool.innerText=SET.schoolName}function fill(a){sub.innerHTML='<option value="">Subject</option>'+a.map(x=>'<option>'+x+'</option>').join('');sub.classList.remove('hide')}function classChanged(){stream.classList.add('hide');sub.classList.add('hide');stream.value='';sub.innerHTML='<option value="">Subject</option>';if(isJSS(cls.value))fill(JSS);if(isSS(cls.value))stream.classList.remove('hide')}function streamChanged(){if(stream.value)fill(SS[stream.value])}function year(){let m=String(SET.session).match(/\d{4}/);return m?m[0]:new Date().getFullYear()}async function getId(){let key=nm().toLowerCase()+'|'+cls.value+'|'+arm.value+'|'+(stream.value||'JSS');let q=await db.collection('students').where('key','==',key).limit(1).get();if(!q.empty)return q.docs[0].data().studentId;let id=String(Math.floor(100+Math.random()*900));await db.collection('students').add({key,name:nm(),className:cls.value,arm:arm.value,stream:stream.value||'JSS',studentId:id,createdAt:firebase.firestore.FieldValue.serverTimestamp()});return id}function bankId(c,s){return c+'__'+String(s).replaceAll('/','-').replaceAll(' ','_')}async function getQ(){let out=[];try{let b=await db.collection('questionBanks').doc(bankId(cls.value,sub.value)).get();if(b.exists&&Array.isArray(b.data().questions))out=b.data().questions}catch(e){}if(out.length)return out;let levels=isJSS(cls.value)?[cls.value,'JSS']:[cls.value,'SS'];for(let lv of levels){let q=await db.collection('quizQuestions').where('active','==',true).where('subject','==',sub.value).where('classLevel','==',lv).get();out=out.concat(q.docs.map(d=>d.data()))}return out}async function startExam(){await loadSet();if(!nm()||!cls.value||!arm.value||!sub.value)return alert('Fill name, class, arm and subject');if(isSS(cls.value)&&!stream.value)return alert('Select stream');if(!sid){sid=await getId();let mid=isSS(cls.value)?stream.value.slice(0,3).toUpperCase():cls.value;cbtNo=(SET.schoolCode||'EDU').toUpperCase()+'-'+mid+'-'+arm.value+'-'+year()+'-'+sid;cbt.innerText=cbtNo;idBox.classList.remove('hide')}let list=await getQ();if(!list.length)return alert('No active '+cls.value+' questions for '+sub.value);current=list.sort(()=>Math.random()-.5).slice(0,Number(SET.questionsPerExam||20));ans={};start.classList.add('hide');res.classList.add('hide');exam.classList.remove('hide');meta.innerHTML='<b>'+nm()+'</b> | CBT: '+cbtNo+' | Class: '+cls.value+' '+arm.value+' | Subject: '+sub.value;render();timerStart(Number(SET.timeMinutes||15)*60)}function render(){qs.innerHTML=current.map((q,i)=>'<div class="q"><h3>Question '+(i+1)+'</h3><p>'+tidy(q.q)+'</p><div class="opt">'+q.options.map((o,j)=>{let L=['A','B','C','D'][j];return '<label><input type="radio" name="q'+i+'" value="'+L+'" onchange="ans['+i+']=this.value"> <b>'+L+'.</b> '+tidy(o)+'</label>'}).join('')+'</div></div>').join('')}function timerStart(t){if(tick)clearInterval(tick);tick=setInterval(()=>{let m=Math.floor(t/60),s=t%60;document.getElementById('timer').innerText=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(t--<=0){clearInterval(tick);submitExam()}},1000)}async function submitExam(){if(tick)clearInterval(tick);let sc=0,a=[];current.forEach((q,i)=>{let ok=(ans[i]||'')==q.answer;if(ok)sc++;a.push({questionNumber:i+1,question:tidy(q.q),selected:ans[i]||'',correct:q.answer,isCorrect:ok})});let pct=Math.round(sc/current.length*100);await db.collection('quizResults').add({name:nm(),studentId:sid,cbtNo,className:cls.value,arm:arm.value,stream:stream.value||'JSS',subject:sub.value,term:SET.term,session:SET.session,examType:SET.examType,status:'Completed',score:sc,total:current.length,percentage:pct,answers:a,submittedAt:firebase.firestore.FieldValue.serverTimestamp()});exam.classList.add('hide');res.classList.remove('hide');rmeta.innerHTML='<table><tr><td>Name</td><td>'+nm()+'</td></tr><tr><td>CBT Number</td><td>'+cbtNo+'</td></tr><tr><td>Class/Arm</td><td>'+cls.value+' '+arm.value+'</td></tr><tr><td>Subject</td><td>'+sub.value+'</td></tr><tr><td>Term</td><td>'+SET.term+'</td></tr><tr><td>Session</td><td>'+SET.session+'</td></tr></table>';score.innerText=sc+'/'+current.length+' - '+pct+'%';review.innerHTML=a.filter(x=>!x.isCorrect).map(x=>'<div class="q"><b>Question '+x.questionNumber+':</b> '+x.question+'<br><span style="color:#b91c1c">Your answer: '+(x.selected||'None')+'</span><br><span style="color:#166534">Correct answer: '+x.correct+'</span></div>').join('')}function anotherSubject(){res.classList.add('hide');start.classList.remove('hide');sub.value='';idBox.classList.remove('hide');window.scrollTo(0,0)}loadSet();</script></body></html>
