<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduCBT Backend Import</title><style>body{font-family:Arial;background:#f4f6f8;padding:18px}.box{max-width:900px;margin:auto;background:white;padding:24px;border-radius:14px;box-shadow:0 8px 25px #0001}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#111827;color:white;border:0;font-weight:bold}.g{background:#166534}.info{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:8px;margin:10px 0}.status{background:#f8fafc;border:1px solid #e5e7eb;padding:14px;border-radius:10px;margin-top:12px;white-space:pre-wrap}.bar{height:18px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#166534}</style></head><body><div class="box"><h1>EduCBT Backend Question Import</h1><div class="info"><b>Use this for large files.</b> Upload once. Backend separates JSS1, JSS2, JSS3, SS1, SS2, SS3 using the Class column.</div><input id="token" type="password" placeholder="Backend admin token"><select id="target"><option value="JSS">JSS General</option><option value="SS">SS General</option><option value="JSS1">JSS1 Only</option><option value="JSS2">JSS2 Only</option><option value="JSS3">JSS3 Only</option><option value="SS1">SS1 Only</option><option value="SS2">SS2 Only</option><option value="SS3">SS3 Only</option></select><select id="mode"><option value="ALL">All Subjects</option></select><input id="file" type="file" accept=".xlsx,.xlsm,.xltx,.xltm"><button class="g" onclick="uploadFile()">Upload Through Backend</button><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Waiting for upload...</div><button onclick="location.href='/admin.html'">Back to Admin</button></div><script>const BACKEND='https://educbt-backend.onrender.com';let poll=null;async function uploadFile(){try{let t=token.value.trim();if(!t)return alert('Enter backend token');if(!file.files[0])return alert('Choose Excel file');status.innerText='Uploading file to backend...';fill.style.width='3%';let fd=new FormData();fd.append('target_class',target.value);fd.append('mode',mode.value);fd.append('file',file.files[0]);let res=await fetch(BACKEND+'/admin/questions/import',{method:'POST',headers:{'x-admin-token':t},body:fd});let data=await res.json().catch(()=>({detail:'Backend returned no JSON'}));if(!res.ok)throw new Error(data.detail||data.message||'Upload failed');status.innerText='Import queued. Job ID: '+data.job_id+'\nWaiting for processing...';fill.style.width='10%';watchJob(data.job_id,t)}catch(e){status.innerText='Error: '+(e.message||e);fill.style.width='0%'}}function watchJob(id,t){if(poll)clearInterval(poll);poll=setInterval(async()=>{try{let r=await fetch(BACKEND+'/admin/jobs/'+id,{headers:{'x-admin-token':t}});let j=await r.json();if(!r.ok)throw new Error(j.detail||'Could not read job');let total=Number(j.total||0),imported=Number(j.imported||0);let pct=total?Math.min(100,Math.round(imported/total*100)):15;fill.style.width=pct+'%';status.innerText='Status: '+j.status+'\nMessage: '+j.message+'\nImported: '+imported+' / '+total+'\nGroups: '+(j.groups||0)+'\nDeactivated old: '+(j.deactivated||0);if(j.status==='done'){fill.style.width='100%';clearInterval(poll);alert('Done: '+imported+' questions imported')}if(j.status==='error'){clearInterval(poll);alert('Import error: '+j.message)}}catch(e){status.innerText='Polling error: '+(e.message||e)}},3000)}</script></body></html>
