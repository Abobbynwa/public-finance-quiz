<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduCBT Question Import</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><style>body{font-family:Arial;background:#f4f6f8;padding:18px}.box{max-width:1050px;margin:auto;background:white;padding:24px;border-radius:14px}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#111827;color:white;border:0;cursor:pointer}.g{background:#166534}.r{background:#b91c1c}.hide{display:none}.info{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:8px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #ddd;padding:8px}th{background:#111827;color:white}@media(max-width:760px){.tabs{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>EduCBT Question Import</h1><div id="login"><input id="pass" type="password" placeholder="Admin password"><button onclick="go()">Login</button></div><div id="main" class="hide"><div class="tabs"><button onclick="show('imp')">Import File</button><button onclick="show('view')">View Questions</button><button onclick="location.href='/admin.html'">Admin</button></div><div id="imp"><h2>Import Master Question File</h2><div class="info">Use one compiled Excel file. Headers must be: Subject, Question, A, B, C, D, Correct Answer. JSS and SS subjects are supported.</div><select id="mode"></select><input id="file" type="file" accept=".xlsx,.xls,.csv"><button onclick="preview()">Preview File</button><button class="g" onclick="send()">Import Questions</button><p id="msg"></p><div class="wrap"><table><thead><tr><th>No</th><th>Subject</th><th>Question</th><th>Answer</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="view" class="hide"><h2>Questions</h2><select id="filter" onchange="renderQ()"></select><button onclick="loadQ()">Refresh</button><button class="g" onclick="enableShown()">Enable Shown Questions</button><p id="count"></p><div class="wrap"><table><thead><tr><th>No</th><th>Subject</th><th>Question</th><th>Status</th></tr></thead><tbody id="qrows"></tbody></table></div></div></div></div><script>const cfg={apiKey:'AIzaSyCgdl-oI3jrvTarOOzEqd791ZhE_CGBv6A',authDomain:'public-finance-quiz.firebaseapp.com',projectId:'public-finance-quiz',storageBucket:'public-finance-quiz.firebasestorage.app',messagingSenderId:'350473490107',appId:'1:350473490107:web:2f7275513a2d8cbad7e39e'};firebase.initializeApp(cfg);const db=firebase.firestore();const SUB=['Economics','Government','Commerce','Accounting','English Language','Mathematics','Biology','Chemistry','Physics','Agricultural Science','Civic Education','CRS','Basic Science','Basic Technology','Social Studies','Business Studies','Computer Studies','Home Economics','PHE'];let parsed=[],all=[],shown=[];mode.innerHTML='<option value="ALL">All Subjects</option>'+SUB.map(s=>'<option>'+s+'</option>').join('');filter.innerHTML='<option value="">All Subjects</option>'+SUB.map(s=>'<option>'+s+'</option>').join('');function show(x){imp.classList.toggle('hide',x!='imp');view.classList.toggle('hide',x!='view');if(x=='view')loadQ()}function go(){let p=pass.value.trim();if(p!='valentine123'&&p!='ADIM@22')return alert('Wrong password');login.classList.add('hide');main.classList.remove('hide')}function norm(x){return String(x||'').trim().toLowerCase().replace(/\s+/g,' ')}function val(r,names){let ks=Object.keys(r);for(let n of names){let k=ks.find(x=>norm(x)==norm(n));if(k)return r[k]}return''}async function readFile(){let f=file.files[0];if(!f){alert('Choose file');return[]}let ab=await f.arrayBuffer(),wb=XLSX.read(ab,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],data=XLSX.utils.sheet_to_json(ws,{defval:''}),m=mode.value;let out=data.map((r,i)=>{let s=String(val(r,['Subject'])).trim();if(m!='ALL')s=s||m;return{row:i+2,subject:s,q:String(val(r,['Question','q'])).trim(),options:[String(val(r,['A','Option A'])).trim(),String(val(r,['B','Option B'])).trim(),String(val(r,['C','Option C'])).trim(),String(val(r,['D','Option D'])).trim()],answer:String(val(r,['Correct Answer','Answer'])).trim().toUpperCase()}}).filter(x=>x.subject||x.q);for(let x of out){if(!SUB.includes(x.subject)||!x.q||x.options.some(o=>!o)||!['A','B','C','D'].includes(x.answer))throw new Error('Invalid row '+x.row+' - check subject, options, answer')}return out}async function preview(){try{parsed=await readFile();let c={};parsed.forEach(x=>c[x.subject]=(c[x.subject]||0)+1);msg.innerText=parsed.length+' valid questions: '+Object.entries(c).map(a=>a[0]+': '+a[1]).join(' | ');rows.innerHTML=parsed.slice(0,50).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.subject+'</td><td>'+x.q+'</td><td>'+x.answer+'</td></tr>').join('')}catch(e){msg.innerText='';alert(e.message)}}async function send(){try{if(!parsed.length)parsed=await readFile();let subjects=mode.value=='ALL'?[...new Set(parsed.map(x=>x.subject))]:[mode.value];if(!confirm('Import '+parsed.length+' questions for '+subjects.join(', ')+'?'))return;msg.innerText='Working...';let old=await db.collection('quizQuestions').get(),b=db.batch(),c=0;old.forEach(d=>{let x=d.data();if(subjects.includes(x.subject)){b.update(db.collection('quizQuestions').doc(d.id),{active:false});c++}});for(let x of parsed){let ref=db.collection('quizQuestions').doc();b.set(ref,{subject:x.subject,q:x.q,options:x.options,answer:x.answer,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});c++;if(c>=430){await b.commit();b=db.batch();c=0}}if(c>0)await b.commit();msg.innerText='Done: '+parsed.length+' questions imported';alert('Done')}catch(e){alert(e.message||'Import failed')}}async function loadQ(){let snap=await db.collection('quizQuestions').get();all=snap.docs.map(d=>({id:d.id,...d.data()}));renderQ()}function renderQ(){let s=filter.value;shown=all.filter(x=>!s||x.subject==s);count.innerText=shown.length+' shown';qrows.innerHTML=shown.slice(0,500).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+String(x.subject||'')+'</td><td>'+String(x.q||'')+'</td><td>'+(x.active?'Active':'Inactive')+'</td></tr>').join('')}async function enableShown(){if(!shown.length)return alert('No shown questions');let b=db.batch(),c=0;for(let x of shown){b.update(db.collection('quizQuestions').doc(x.id),{active:true});c++;if(c>=430){await b.commit();b=db.batch();c=0}}if(c>0)await b.commit();alert('Enabled shown questions');loadQ()}</script></body></html>
