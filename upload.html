<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Upload Questions</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial;background:#f4f6f8;margin:0;padding:20px}.box{max-width:900px;margin:auto;background:white;padding:24px;border-radius:14px;box-shadow:0 5px 20px #0001}input,select,button{width:100%;padding:14px;margin:10px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}button{background:#111827;color:white;border:0;cursor:pointer}.green{background:#166534}.info{background:#eff6ff;border:1px solid #bfdbfe;padding:14px;border-radius:8px;line-height:1.6}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{border:1px solid #ddd;padding:8px}th{background:#111827;color:#fff}.hide{display:none}</style></head><body>
<div class="box"><h1>Upload All Subject Questions</h1>
<div id="login"><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p>Password: valentine123</p></div>
<div id="main" class="hide"><div class="info"><b>Select All Subjects</b> for the master Excel file. Required headers: Subject, Question, A, B, C, D, Correct Answer.</div><select id="mode"><option value="ALL">All Subjects</option><option>Economics</option><option>Government</option><option>Commerce</option><option>Accounting</option><option>English Language</option><option>Mathematics</option><option>Biology</option><option>Chemistry</option><option>Physics</option><option>Agricultural Science</option><option>Civic Education</option><option>CRS</option></select><input id="file" type="file" accept=".xlsx,.xls,.csv"><button onclick="preview()">Preview File</button><button class="green" onclick="upload()">Upload & Replace Active Questions</button><p id="msg"></p><table><thead><tr><th>No</th><th>Subject</th><th>Question</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Answer</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
const cfg={apiKey:"AIzaSyCgdl-oI3jrvTarOOzEqd791ZhE_CGBv6A",authDomain:"public-finance-quiz.firebaseapp.com",projectId:"public-finance-quiz",storageBucket:"public-finance-quiz.firebasestorage.app",messagingSenderId:"350473490107",appId:"1:350473490107:web:2f7275513a2d8cbad7e39e"};firebase.initializeApp(cfg);const db=firebase.firestore();
const SUBJECTS=["Economics","Government","Commerce","Accounting","English Language","Mathematics","Biology","Chemistry","Physics","Agricultural Science","Civic Education","CRS"];let parsed=[];
function login(){let p=document.getElementById('pass').value.trim();if(p!=='valentine123'&&p!=='ADIM@22'){alert('Wrong password');return}document.getElementById('login').classList.add('hide');document.getElementById('main').classList.remove('hide')}
function esc(x){return String(x||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function norm(x){return String(x||'').trim().toLowerCase().replace(/\s+/g,' ')}function val(row,names){let keys=Object.keys(row);for(let n of names){let k=keys.find(x=>norm(x)===norm(n));if(k)return row[k]}return''}
async function readFile(){let f=document.getElementById('file').files[0],mode=document.getElementById('mode').value;if(!f){alert('Choose file first');return[]}document.getElementById('msg').innerText='Reading file...';let ab=await f.arrayBuffer(),wb=XLSX.read(ab,{type:'array'}),ws=wb.Sheets[wb.SheetNames.includes('Questions')?'Questions':wb.SheetNames[0]],data=XLSX.utils.sheet_to_json(ws,{defval:''});let out=data.map((r,i)=>{let s=String(val(r,['Subject'])).trim();if(mode!=='ALL')s=s||mode;return{row:i+2,subject:s,q:String(val(r,['Question','q'])).trim(),options:[String(val(r,['A','Option A'])).trim(),String(val(r,['B','Option B'])).trim(),String(val(r,['C','Option C'])).trim(),String(val(r,['D','Option D'])).trim()],answer:String(val(r,['Correct Answer','Answer'])).trim().toUpperCase()}}).filter(x=>x.subject||x.q||x.answer||x.options.some(Boolean));for(let x of out){if(!SUBJECTS.includes(x.subject)||!x.q||x.options.some(o=>!o)||!['A','B','C','D'].includes(x.answer))throw new Error('Invalid row '+x.row+' - check subject/header/options/answer')}return out}
async function preview(){try{parsed=await readFile();let counts={};parsed.forEach(x=>counts[x.subject]=(counts[x.subject]||0)+1);document.getElementById('msg').innerText=parsed.length+' valid questions: '+Object.entries(counts).map(([s,n])=>s+': '+n).join(' | ');document.getElementById('rows').innerHTML=parsed.slice(0,20).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.subject)}</td><td>${esc(x.q)}</td><td>${esc(x.options[0])}</td><td>${esc(x.options[1])}</td><td>${esc(x.options[2])}</td><td>${esc(x.options[3])}</td><td>${x.answer}</td></tr>`).join('')}catch(e){document.getElementById('msg').innerText='';alert(e.message);console.error(e)}}
async function upload(){try{if(!parsed.length)parsed=await readFile();let mode=document.getElementById('mode').value,subjects=mode==='ALL'?[...new Set(parsed.map(x=>x.subject))]:[mode];if(!confirm('Replace active questions for: '+subjects.join(', ')+'?'))return;document.getElementById('msg').innerText='Uploading... do not close this page.';let old=await db.collection('quizQuestions').get(),batch=db.batch(),c=0;old.forEach(d=>{let data=d.data();if(subjects.includes(data.subject||'Economics')){batch.update(db.collection('quizQuestions').doc(d.id),{active:false});c++}});for(let x of parsed){let ref=db.collection('quizQuestions').doc();batch.set(ref,{subject:x.subject,q:x.q,options:x.options,answer:x.answer,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});c++;if(c>=450){await batch.commit();batch=db.batch();c=0}}if(c>0)await batch.commit();document.getElementById('msg').innerText='Upload complete: '+parsed.length+' questions uploaded.';alert('Upload complete')}catch(e){alert(e.message||'Upload failed');console.error(e)}}
</script></body></html>
